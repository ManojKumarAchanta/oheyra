name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm Store Directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Shared Packages
        run: |
          pnpm --filter @pulse/contracts build
          pnpm --filter @pulse/utils build

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Validate Fastify API Build
        run: pnpm build:api

      - name: Validate Next.js Frontend Build
        env:
          NEXT_PUBLIC_SITE_URL: https://pulse.city
          NEXT_PUBLIC_API_URL: https://pulse-api.koyeb.app
          NEXT_PUBLIC_MAP_STYLE_URL: https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json
        run: pnpm build:web
