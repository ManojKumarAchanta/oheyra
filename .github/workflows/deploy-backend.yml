name: Deploy Backend (Koyeb)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'koyeb.yaml'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-koyeb:
    name: Trigger Koyeb Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Deploy Service via Koyeb CLI
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          if [ -z "$KOYEB_TOKEN" ]; then
            echo "::warning ::KOYEB_API_TOKEN secret not configured yet. Skipping CLI trigger."
            echo "You can link your GitHub repo directly in Koyeb UI or add the KOYEB_API_TOKEN secret to GitHub Secrets."
            exit 0
          fi
          koyeb service redeploy pulse-api/pulse-api
